apiVersion: v1
kind: Namespace
metadata:
  name: node-remediation-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-remediation-controller
  namespace: node-remediation-system
---
# Cluster-wide read + node cordon. Eviction and delete are NOT granted here; they
# are granted per approved workload namespace by workload-namespace-rbac.yaml
# (evict) and optional/purge-rbac.yaml (delete).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-remediation-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nvsentinel.nvidia.com"]
    resources: ["drainrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nvsentinel.nvidia.com"]
    resources: ["drainrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-remediation-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-remediation-controller
subjects:
  - kind: ServiceAccount
    name: node-remediation-controller
    namespace: node-remediation-system
---
# Leader-election lease in the controller namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-remediation-controller-lease
  namespace: node-remediation-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-remediation-controller-lease
  namespace: node-remediation-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-remediation-controller-lease
subjects:
  - kind: ServiceAccount
    name: node-remediation-controller
    namespace: node-remediation-system
