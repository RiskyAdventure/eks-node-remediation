apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-health-issue-adapter
  namespace: node-remediation-system
---
# Cluster-wide read of Nodes only (providerID mapping).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-health-issue-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-health-issue-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-health-issue-adapter
subjects:
  - kind: ServiceAccount
    name: aws-health-issue-adapter
    namespace: node-remediation-system
---
# DrainRequest creation is limited to the controller namespace (DRAIN_NAMESPACE).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-health-issue-adapter
  namespace: node-remediation-system
rules:
  - apiGroups: ["nvsentinel.nvidia.com"]
    resources: ["drainrequests"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-health-issue-adapter
  namespace: node-remediation-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-health-issue-adapter
subjects:
  - kind: ServiceAccount
    name: aws-health-issue-adapter
    namespace: node-remediation-system
