apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-health-issue-adapter
  namespace: node-remediation-system
  labels: {app: aws-health-issue-adapter}
spec:
  # One consumer. SQS visibility bounds duplicate delivery and DrainRequest names are
  # idempotent, so a second replica is safe but adds no throughput for this volume.
  replicas: 1
  selector: {matchLabels: {app: aws-health-issue-adapter}}
  template:
    metadata:
      labels: {app: aws-health-issue-adapter}
    spec:
      serviceAccountName: aws-health-issue-adapter
      automountServiceAccountToken: true
      priorityClassName: system-cluster-critical
      nodeSelector: {REPLACE_WITH_CONTROL_TIER_LABEL_KEY: REPLACE_WITH_CONTROL_TIER_LABEL_VALUE}
      tolerations:
        - {key: REPLACE_WITH_CONTROL_TIER_TAINT_KEY, operator: Equal, value: REPLACE_WITH_CONTROL_TIER_TAINT_VALUE, effect: NoSchedule}
      containers:
        - name: adapter
          image: REPLACE_WITH_CUSTOMER_ECR/aws-health-issue-adapter:0.2.3
          env:
            - {name: EXPECTED_ACCOUNT, value: "REPLACE_WITH_ACCOUNT_ID"}
            - {name: EXPECTED_REGION, value: "REPLACE_WITH_REGION"}
            - {name: QUEUE_URL, value: "REPLACE_WITH_QUEUE_URL"}
            - {name: DRAIN_NAMESPACE, value: "node-remediation-system"}
            - {name: ALLOWED_SOURCES, value: "aws.health"}
            - {name: OBSERVE_ONLY, value: "true"}
            - {name: ENABLED_DRAIN_EVENT_CODES, value: ""}
            - {name: UNKNOWN_EVENT_CODE_ACTION, value: "ignore"}
            - {name: UNMAPPED_INSTANCE_POLICY, value: "skip"}
            - {name: MAX_INSTANCES_PER_EVENT, value: "25"}
            - {name: MANAGED_NODE_LABEL_KEY, value: "workload"}
            - {name: MANAGED_NODE_LABEL_VALUES, value: "REPLACE_WITH_MANAGED_NODE_LABEL_VALUES"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 192Mi}
