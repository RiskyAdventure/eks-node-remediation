# NVSentinel's metadata-collector requires a RuntimeClass named `nvidia`. The GPU
# Operator normally creates it; without the Operator you create it yourself. EKS
# NVIDIA AMIs ship containerd with a `nvidia` runtime handler, so this object only
# names it. Adjust the scheduling block to your GPU node groups.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
scheduling:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
